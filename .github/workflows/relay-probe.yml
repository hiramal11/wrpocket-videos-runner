# 試験用 (2026-09-26): Actions から Cloudflare の Worker (wrpocket-rss-relay) 経由で YouTube の RSS が取れるか
name: relay-probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hiramal11/wildrift
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 1
          sparse-checkout: |
            data/manual/youtube_channels.json
            data/youtube/tracked_channels.json
          sparse-checkout-cone-mode: false
      - run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error
          reg = json.load(open("data/manual/youtube_channels.json"))["channels"]
          trk = json.load(open("data/youtube/tracked_channels.json"))["channels"]
          ids = [c["id"] for c in reg] + [t["id"] for t in trk if t["id"] not in {c["id"] for c in reg}]
          todo, t0, codes = ids, time.time(), {}
          for rnd in range(1, 9):
              fail = []
              for i in todo:
                  try:
                      urllib.request.urlopen(urllib.request.Request(f"https://wrpocket-rss-relay.pauldot.workers.dev/feed?channel_id={i}", headers={"User-Agent": "wrpocket-videos-runner/1.0 (+https://wrpocket.app)"}), timeout=30).read()
                  except urllib.error.HTTPError as e:
                      codes[e.code] = codes.get(e.code, 0) + 1; fail.append(i)
                  except Exception as e:
                      codes[type(e).__name__] = codes.get(type(e).__name__, 0) + 1; fail.append(i)
              print(f"round {rnd}: failed {len(fail)} / {len(todo)}  {time.time()-t0:.1f}s")
              todo = fail
              if not todo: break
              time.sleep(5)
          print("final failed", len(todo), "codes", codes)
          PY
