# 毎時の動画の取り込み (2026-09-26 に Chromebook の cron から移し、 同日 3 時間ごと → 毎時)。
# 起動は Cloudflare の Worker (wrpocket-rank-watcher)。 RSS を API で補う間隔は Worker の VIDEOS_API_EVERY_H (既定 1 = 毎回)。
# 取り込みのコードは非公開リポジトリ hiramal11/wildrift の scripts/maintenance/videos_live_ci.sh。
# 本番の一覧は main のコード、 dev の一覧は dev のコードで作る (端末の cron_videos_live.sh と同じ)。
name: videos-live
on:
  repository_dispatch:
    types: [videos-live]
  workflow_dispatch:
    inputs:
      target:
        description: どちらの一覧を作るか (both = 本番と dev)
        type: choice
        options: [both, dev, prod]
        default: both
      fallback:
        description: dev でも RSS の取れなかったチャンネルを API で補う (試験用)
        type: boolean
        default: false
      rss_only:
        description: 本番も RSS だけで取る (Worker の VIDEOS_API_EVERY_H で補わない回)
        type: boolean
        default: false
concurrency:
  group: videos-live
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        target: ${{ fromJSON(github.event.inputs.target == 'dev' && '["dev"]' || github.event.inputs.target == 'prod' && '["prod"]' || '["prod","dev"]') }}
    steps:
      - name: 非公開リポジトリのコードを取る
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hiramal11/wildrift
          ref: ${{ matrix.target == 'prod' && 'main' || 'dev' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          fetch-depth: 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: 取り込んで KV に書く (${{ matrix.target }})
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRP_YT_RSS_FALLBACK: ${{ github.event.inputs.rss_only == 'true' && 'off' || github.event.inputs.fallback == 'true' && 'api' || '' }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          pip install -q requests
          bash scripts/maintenance/videos_live_ci.sh ${{ matrix.target }}
